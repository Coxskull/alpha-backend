name: Disposable EF migration candidate
on:
  pull_request:
    paths:
      - '.github/workflows/ef-migration-candidate.yml'
      - 'Data/**'
      - 'Models/**'
      - 'Migrations/**'
      - 'Alpha.API.csproj'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/ef-migration-candidate-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alpha_ci
          POSTGRES_PASSWORD: synthetic_not_for_use
          POSTGRES_DB: alpha_design_time
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_ci -d alpha_design_time"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate review-only EF migration candidate
        shell: bash
        run: |
          mkdir -p evidence
          set -o pipefail
          dotnet tool install --tool-path .ci-tools dotnet-ef --version 8.0.0 2>&1 | tee evidence/tool-install.log
          dotnet restore Alpha.API.csproj 2>&1 | tee evidence/restore.log
          # Design-time model construction only. No database update and no hosted credentials.
          export ASPNETCORE_ENVIRONMENT=Development
          export DATABASE_URL='postgresql://alpha_ci:disposable-ci-only@127.0.0.1:5432/alpha_model_ci'
          export Jwt__Key='synthetic-ci-only-key-for-design-time-not-production'
          .ci-tools/dotnet-ef migrations add ReconcileCurrentModelCandidate --project Alpha.API.csproj --startup-project Alpha.API.csproj --context AppDbContext --output-dir Migrations 2>&1 | tee evidence/generation.log
          git diff -- Migrations > evidence/migration-diff.patch
          git status --short > evidence/worktree-status.txt
          test -s evidence/migration-diff.patch
          if grep -E '^\+.*migrationBuilder\.(DropTable|DropColumn|DeleteData|Sql)\(' evidence/migration-diff.patch; then
            echo 'REVIEW REQUIRED: candidate contains potentially destructive operations' | tee evidence/destructive-operations.txt
          fi
      - name: Generate SQL upgrade script and apply migration to disposable PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          .ci-tools/dotnet-ef migrations script 20260609152717_OrderRelations --idempotent --project Alpha.API.csproj --startup-project Alpha.API.csproj --context AppDbContext --output evidence/candidate-upgrade.sql 2>&1 | tee evidence/script-generation.log
          .ci-tools/dotnet-ef database update 20260609152717_OrderRelations --project Alpha.API.csproj --startup-project Alpha.API.csproj --context AppDbContext 2>&1 | tee evidence/baseline-upgrade.log
          .ci-tools/dotnet-ef database update --project Alpha.API.csproj --startup-project Alpha.API.csproj --context AppDbContext 2>&1 | tee evidence/candidate-upgrade.log
          # Verify migration metadata exists and all expected model tables were created.
          PGPASSWORD=synthetic_not_for_use psql -h 127.0.0.1 -U alpha_ci -d alpha_design_time -Atc 'SELECT COUNT(*) FROM public."__EFMigrationsHistory"' | tee evidence/applied-migration-count.txt
          PGPASSWORD=synthetic_not_for_use psql -h 127.0.0.1 -U alpha_ci -d alpha_design_time -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name <> '__EFMigrationsHistory'" | tee evidence/created-table-count.txt
          test "$(cat evidence/applied-migration-count.txt)" = 3
          test "$(cat evidence/created-table-count.txt)" = 51
      - name: Publish generated migration to dedicated review branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Migrations/20261012035108_ReconcileCurrentModelCandidate.cs Migrations/20261012035108_ReconcileCurrentModelCandidate.Designer.cs Migrations/AppDbContextModelSnapshot.cs 2>/dev/null || true
          # Generated migration timestamp varies per run; stage the exact candidate instead.
          git add Migrations/*ReconcileCurrentModelCandidate* Migrations/AppDbContextModelSnapshot.cs
          git commit -m 'feat(db): add generated EF Core model reconciliation migration'
          git push origin HEAD:refs/heads/db/ef-model-reconciliation-20261012
      - name: Preserve generated migration files for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef-migration-candidate-${{ github.sha }}
          path: |
            evidence/
            Migrations/*ReconcileCurrentModelCandidate*
            Migrations/AppDbContextModelSnapshot.cs
          retention-days: 14
          if-no-files-found: warn
