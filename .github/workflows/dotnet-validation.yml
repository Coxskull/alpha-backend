name: .NET backend validation

on:
  pull_request:
    branches: [main, "security/**", review/warning-remediation-evidence-20261012, fix/pr32-financial-audit-integrity, fix/pr33-preserve-refund-conflict-holds, feature/phase2-conflict-review, feature/phase2-claim-recovery-release]
  push:
    branches: [main, "security/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.425
      - name: Restore
        run: dotnet restore Alpha.API.csproj --locked-mode
      - name: Audit vulnerable NuGet dependencies
        shell: bash
        run: |
          set -o pipefail
          audit_output="$(dotnet list Alpha.API.csproj package --vulnerable --include-transitive 2>&1)" || {
            printf '%s\n' "$audit_output"
            exit 1
          }
          printf '%s\n' "$audit_output"
          if ! grep -Fq 'has no vulnerable packages' <<< "$audit_output"; then
            echo "::error::NuGet vulnerability audit did not confirm a clean dependency graph."
            exit 1
          fi
      - name: Build Release
        run: dotnet build Alpha.API.csproj --configuration Release --no-restore -warnaserror

      - name: Run backend unit and security tests
        run: dotnet test Tests/Alpha.API.Tests/Alpha.API.Tests.csproj --configuration Release -p:RestoreLockedMode=true -warnaserror

      # AEB-012: only on diagnostic security/aeb012 branches; no credentials, data writes, artifact uploads or deployments.
      - name: Verify isolated runtime certificate and PostgreSQL VerifyFull
        if: startsWith(github.ref, 'refs/heads/security/aeb012-')
        shell: bash
        run: |
          set -euo pipefail
          docker build --file Dockerfile.aeb012-tls-diagnostic --tag aeb012-tls-check:ci .
          docker run --rm --entrypoint /bin/sh aeb012-tls-check:ci -ec '
            set -eu
            ca="$Database__RootCertificatePath"
            host="aws-1-ap-southeast-1.pooler.supabase.com"
            test "$ca" = "/app/out/certs/prod-ca-2021.crt"
            test -r "$ca"
            echo "CA_IN_ISOLATED_RUNTIME=PASS"
            openssl x509 -in "$ca" -noout -subject -issuer -dates
            timeout 35 openssl s_client -starttls postgres \
              -connect "$host:5432" -servername "$host" \
              -verify_hostname "$host" -verify_return_error -CAfile "$ca" -brief </dev/null
            echo "ISOLATED_RUNTIME_TLS=PASS"
          '
