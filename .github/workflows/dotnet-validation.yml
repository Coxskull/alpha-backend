name: .NET backend validation

on:
  pull_request:
    branches: [main, "security/**"]
  push:
    branches: [main, "security/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Alpha.API.csproj
      - name: Audit vulnerable NuGet dependencies
        shell: bash
        run: |
          set -o pipefail
          audit_output="$(dotnet list Alpha.API.csproj package --vulnerable --include-transitive 2>&1)" || {
            printf '%s\n' "$audit_output"
            exit 1
          }
          printf '%s\n' "$audit_output"
          if ! grep -Fq 'has no vulnerable packages' <<< "$audit_output"; then
            echo "::error::NuGet vulnerability audit did not confirm a clean dependency graph."
            exit 1
          fi
      - name: Build Release
        run: dotnet build Alpha.API.csproj --configuration Release --no-restore

      - name: Run PayPal capture validator tests
        run: dotnet test Tests/Alpha.API.Tests/Alpha.API.Tests.csproj --configuration Release
