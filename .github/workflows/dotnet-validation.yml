name: .NET backend validation

on:
  pull_request:
    branches: [main, "security/**"]
  push:
    branches: [main, "security/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Alpha.API.csproj
      - name: Audit vulnerable NuGet dependencies
        run: dotnet list Alpha.API.csproj package --vulnerable --include-transitive
      - name: Build Release
        run: dotnet build Alpha.API.csproj --configuration Release --no-restore
